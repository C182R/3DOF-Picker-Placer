<rect x="20" y="390" width="700" height="310" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="36" y="414" text-anchor="start" class="t">Setup notes</text>
<text x="36" y="438" text-anchor="start" class="s">1. PD trigger DIP = 20 V. Use a 100 W (20 V / 5 A) charger and a 5 A cable.</text>
<text x="36" y="457" text-anchor="start" class="s">2. Set XL4016 to 12.0 V and MP1584 to 5.0 V before connecting anything to them.</text>
<text x="36" y="476" text-anchor="start" class="s">3. Adapter jumper on A. Waveshare wires TX→TX, RX→RX; if `scan` finds nothing, swap them.</text>
<text x="36" y="495" text-anchor="start" class="s">4. C1 and D1 clamp into the adapter's power terminal (stripe to GND, band to +12 V).</text>
<text x="36" y="514" text-anchor="start" class="s">5. Contact 1 cuts servo power. Contact 2 opens the ESP32 sense loop (a broken wire also trips it).</text>
<text x="36" y="533" text-anchor="start" class="s">6. The 5 V logic tap is upstream of the E-stop, so the ESP32 stays on during a stop.</text>
<text x="36" y="552" text-anchor="start" class="s">7. Don't plug USB into the ESP32 while the 5 V rail is connected unless it has a VBUS diode.</text>
<text x="36" y="571" text-anchor="start" class="s">8. Set each servo's ID with `setid`, one servo at a time, before daisy-chaining.</text>
<text x="36" y="590" text-anchor="start" class="s">9. +12 V and GND junctions: lever splice connectors (not yet in the BOM).</text>
<polyline points="36,618 70,618" fill="none" stroke="#f85149" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
