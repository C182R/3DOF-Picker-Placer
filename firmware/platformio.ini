; Palletino firmware: ESP32 DevKit (ESP-WROOM-32)
; Build/upload:  pio run -t upload    Monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
lib_deps =
    https://github.com/workloads/scservo.git
